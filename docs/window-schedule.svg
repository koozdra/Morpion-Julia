<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Acceptance window over three timer cycles</title>
<desc id="d">Points below the best score that a configuration may score and still be kept, per maintenance interval of 100,000 iterations. Each 128-interval cycle starts at the step back (5, then 6, then 5) and narrows linearly as (1 - k/128) to 0, then reheats.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .muted { fill: #898781; }
  .ink { fill: #0b0b0b; font-weight: 600; }
  .secondary { fill: #52514e; }
  .series { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .ink { fill: #f0efec; }
    .secondary { fill: #c3c2b7; }
    .series { stroke: #3987e5; }
  }
</style>
<rect class="bg" width="900" height="330" rx="6"/>
<line class="grid" x1="56" x2="876" y1="266.0" y2="266.0"/>
<text class="muted" x="48" y="270.0" text-anchor="end">0</text>
<line class="grid" x1="56" x2="876" y1="232.3" y2="232.3"/>
<text class="muted" x="48" y="236.3" text-anchor="end">1</text>
<line class="grid" x1="56" x2="876" y1="198.6" y2="198.6"/>
<text class="muted" x="48" y="202.6" text-anchor="end">2</text>
<line class="grid" x1="56" x2="876" y1="164.9" y2="164.9"/>
<text class="muted" x="48" y="168.9" text-anchor="end">3</text>
<line class="grid" x1="56" x2="876" y1="131.1" y2="131.1"/>
<text class="muted" x="48" y="135.1" text-anchor="end">4</text>
<line class="grid" x1="56" x2="876" y1="97.4" y2="97.4"/>
<text class="muted" x="48" y="101.4" text-anchor="end">5</text>
<line class="grid" x1="56" x2="876" y1="63.7" y2="63.7"/>
<text class="muted" x="48" y="67.7" text-anchor="end">6</text>
<line class="grid" x1="56" x2="876" y1="30.0" y2="30.0"/>
<text class="muted" x="48" y="34.0" text-anchor="end">7</text>
<line class="axis" x1="56.0" x2="56.0" y1="266" y2="271"/>
<text class="muted" x="56.0" y="285" text-anchor="middle">0</text>
<line class="axis" x1="329.3" x2="329.3" y1="266" y2="271"/>
<text class="muted" x="329.3" y="285" text-anchor="middle">128</text>
<line class="axis" x1="602.7" x2="602.7" y1="266" y2="271"/>
<text class="muted" x="602.7" y="285" text-anchor="middle">256</text>
<line class="axis" x1="876.0" x2="876.0" y1="266" y2="271"/>
<text class="muted" x="876.0" y="285" text-anchor="middle">384</text>
<line class="axis" x1="56" x2="876" y1="266" y2="266"/>
<path class="series" d="M56.0,97.4 H83.8 V131.1 H139.3 V164.9 H192.7 V198.6 H248.2 V232.3 H303.7 V266.0 H329.3 V63.7 H352.8 V97.4 H397.7 V131.1 H444.6 V164.9 H489.5 V198.6 H536.5 V232.3 H581.3 V266.0 H602.7 V97.4 H630.4 V131.1 H685.9 V164.9 H739.3 V198.6 H794.9 V232.3 H850.4 V266.0 H876.0"/>
<text class="ink" x="62.0" y="90.4">start 5</text>
<text class="ink" x="335.3" y="56.7">start 6</text>
<text class="ink" x="608.7" y="90.4">start 5</text>
<text class="secondary" x="107.2" y="77.2">cooling: the window narrows,</text>
<text class="secondary" x="107.2" y="92.2">pruned configs go to the archive</text>
<text class="secondary" x="335.3" y="254.2">reheat: archive back in</text>
<text class="secondary" x="608.7" y="254.2">reheat: archive back in</text>
<text class="secondary" x="608.7" y="41.7">rich cycle: step back 6 → 5</text>
<text class="secondary" x="335.3" y="41.7">lean cycle: step back 5 → 6</text>
<text class="muted" x="466.0" y="316" text-anchor="middle">maintenance interval (100,000 iterations each); a cycle is 128 intervals</text>
<text class="muted" transform="translate(16 148.0) rotate(-90)" text-anchor="middle">window width (points below the best)</text>
</svg>
