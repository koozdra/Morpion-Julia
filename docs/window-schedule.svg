<text class="ink" x="62.0" y="62.3">start 10</text>
<text class="ink" x="335.3" y="42.7">start 11</text>
<text class="ink" x="608.7" y="62.3">start 10</text>
<text class="secondary" x="113.7" y="96.9">cooling: the window narrows,</text>
<text class="secondary" x="113.7" y="111.9">pruned configs go to the archive</text>
<text class="secondary" x="335.3" y="242.4">reheat: archive back in</text>
